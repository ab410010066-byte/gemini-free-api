<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER GATEWAY · Gemini Web2API Telemetry Center</title>
<!-- 本地嵌入 Chart.js，零外網依賴 -->
<script src="chart.umd.min.js"></script>
<style>
/* ─── AETHER NEO-CYBERNETIC & APPLE LIQUID GLASS DESIGN SYSTEM ────────────── */
:root {
  /* Dark Mode (Default) */
  --bg-base: #06080D;
  --bg-surface: #0B0F17;
  --bg-surface-elevated: #111724;
  --bg-surface-hover: #172033;
  --bg-surface-active: #1E2B44;
  --bg-glass: rgba(11, 15, 23, 0.78);
  --bg-glass-elevated: rgba(17, 23, 36, 0.88);
  --bg-glass-card: rgba(15, 21, 33, 0.72);

  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-medium: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.22);
  --border-glow: rgba(0, 242, 254, 0.35);

  --text-primary: #F3F4F6;
  --text-secondary: #9CA3AF;
  --text-muted: #6B7280;
  --text-dim: #4B5563;

  /* Accents */
  --accent-cyan: #00F2FE;
  --accent-indigo: #4FACFE;
  --accent-blue: #3B82F6;
  --accent-emerald: #10B981;
  --accent-emerald-bg: rgba(16, 185, 129, 0.14);
  --accent-amber: #F59E0B;
  --accent-amber-bg: rgba(245, 158, 11, 0.14);
  --accent-rose: #EF4444;
  --accent-rose-bg: rgba(239, 68, 68, 0.14);
  --accent-purple: #8B5CF6;
  --accent-purple-bg: rgba(139, 92, 246, 0.14);

  --grad-primary: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
  --grad-aurora: linear-gradient(135deg, #10B981 0%, #00F2FE 100%);
  --grad-amber: linear-gradient(135deg, #F59E0B 0%, #EF4444 100%);
  --grad-purple: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
  --grad-surface: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 100%);

  --shadow-sm: 0 2px 4px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 18px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4);
  --shadow-lg: 0 14px 36px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 24px rgba(0, 242, 254, 0.22);
  --specular-border: inset 0 1px 0 rgba(255, 255, 255, 0.12);

  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-full: 9999px;

  --sb-width: 256px;
  --sb-collapsed: 72px;
  --topbar-h: 64px;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
}

[data-theme="light"] {
  --bg-base: #F4F6FB;
  --bg-surface: #FFFFFF;
  --bg-surface-elevated: #F8FAFD;
  --bg-surface-hover: #EEF2F9;
  --bg-surface-active: #E2E8F4;
  --bg-glass: rgba(255, 255, 255, 0.88);
  --bg-glass-elevated: rgba(248, 250, 253, 0.94);
  --bg-glass-card: rgba(255, 255, 255, 0.82);

  --border-subtle: rgba(0, 0, 0, 0.06);
  --border-medium: rgba(0, 0, 0, 0.12);
  --border-strong: rgba(0, 0, 0, 0.22);
  --border-glow: rgba(0, 120, 250, 0.25);

  --text-primary: #111827;
  --text-secondary: #4B5563;
  --text-muted: #6B7280;
  --text-dim: #9CA3AF;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 28px rgba(0,0,0,0.12);
  --shadow-glow: 0 0 20px rgba(79, 172, 254, 0.25);
  --specular-border: inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Custom Scrollbars */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: var(--r-full); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

/* Typography & General Utilities */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.highlight { color: var(--accent-cyan); font-weight: 500; }
.fw-bold { font-weight: 600; }
.fw-semi { font-weight: 500; }

/* ─── SHELL LAYOUT ───────────────────────────────────────────────────────── */
#app { display: flex; min-height: 100vh; position: relative; }

/* Background Ambient Glow */
.ambient-glow {
  position: fixed;
  top: -200px;
  right: -100px;
  width: 650px;
  height: 650px;
  background: radial-gradient(circle, rgba(0, 242, 254, 0.07) 0%, rgba(79, 172, 254, 0.03) 40%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.ambient-glow-2 {
  position: fixed;
  bottom: -250px;
  left: 200px;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.05) 0%, rgba(16, 185, 129, 0.02) 40%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ─── SIDEBAR (APPLE GLASS) ──────────────────────────────────────────────── */
.sidebar {
  width: var(--sb-width);
  background: var(--bg-glass);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-md);
}
.sidebar.collapsed { width: var(--sb-collapsed); }

.side-header {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid var(--border-subtle);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text-primary);
  overflow: hidden;
  white-space: nowrap;
}
.brand-orb {
  width: 34px;
  height: 34px;
  border-radius: var(--r-sm);
  background: var(--grad-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
}
.brand-orb svg { width: 20px; height: 20px; fill: #07090E; }
.brand-name {
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.brand-tag {
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: var(--r-xs);
  background: rgba(0, 242, 254, 0.15);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 242, 254, 0.3);
}
.side-collapse-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  border-radius: var(--r-xs);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.side-collapse-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

.side-nav {
  flex: 1;
  padding: 14px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-section-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 12px 12px 6px 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar.collapsed .nav-section-title { display: none; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--r-sm);
  color: var(--text-secondary);
  text-decoration: none;
  border: 1px solid transparent;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  overflow: hidden;
}
.nav-item:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
  border-color: var(--border-subtle);
}
.nav-item.active {
  background: rgba(0, 242, 254, 0.1);
  color: var(--accent-cyan);
  border-color: rgba(0, 242, 254, 0.25);
  box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.08);
}
.nav-item svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.sidebar.collapsed .nav-label { display: none; }

.side-footer {
  padding: 14px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cluster-telemetry-box {
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 11.5px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar.collapsed .cluster-telemetry-box { display: none; }
.cluster-telemetry-row { display: flex; justify-content: space-between; align-items: center; }
.cluster-telemetry-row .k { color: var(--text-muted); }
.cluster-telemetry-row .v { font-weight: 600; }

.side-actions-row {
  display: flex;
  gap: 6px;
}
.btn-side {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-xs);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-side:hover { background: rgba(255,255,255,0.09); color: var(--text-primary); }
.btn-side.logout:hover { color: var(--accent-rose); border-color: rgba(239, 68, 68, 0.3); }
.btn-side svg { width: 14px; height: 14px; fill: currentColor; }
.sidebar.collapsed .side-actions-row { flex-direction: column; }
.sidebar.collapsed .btn-side .nav-label { display: none; }

/* ─── CONTENT WRAPPER ────────────────────────────────────────────────────── */
.content-wrapper {
  flex: 1;
  margin-left: var(--sb-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.sidebar.collapsed + .content-wrapper { margin-left: var(--sb-collapsed); }

.topbar {
  height: var(--topbar-h);
  background: var(--bg-glass);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 90;
}
.topbar-left { display: flex; align-items: baseline; gap: 14px; }
.page-heading {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.page-heading-sub { font-size: 12.5px; color: var(--text-muted); }
.topbar-right { display: flex; align-items: center; gap: 12px; }

.status-beacon {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-radius: var(--r-full);
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.25);
  font-size: 12px;
  color: var(--accent-emerald);
}
.status-beacon.bad {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.25);
  color: var(--accent-rose);
}
.pulse-orb {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-emerald);
  box-shadow: 0 0 8px var(--accent-emerald);
  animation: beaconPulse 2s infinite;
}
.status-beacon.bad .pulse-orb {
  background: var(--accent-rose);
  box-shadow: 0 0 8px var(--accent-rose);
}
@keyframes beaconPulse {
  0% { transform: scale(0.9); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0.7; }
}

main {
  flex: 1;
  padding: 24px 28px 40px 28px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 1680px;
  margin: 0 auto;
  width: 100%;
}

/* ─── CARDS & SURFACES ───────────────────────────────────────────────────── */
.card {
  background: var(--bg-glass-card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-medium);
  box-shadow: var(--shadow-sm), var(--specular-border);
  border-radius: var(--r-md);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
  border-color: var(--border-strong);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-size: 14.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title svg { width: 17px; height: 17px; fill: var(--accent-cyan); }
.card-body { padding: 20px; }

/* ─── BUTTONS & INPUTS ───────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border-medium);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm), var(--specular-border);
  user-select: none;
}
.btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--grad-primary);
  border: 1px solid rgba(0, 242, 254, 0.4);
  color: #06080D;
  box-shadow: 0 0 16px rgba(0, 242, 254, 0.25);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #27f5ff 0%, #68b8ff 100%);
  box-shadow: 0 0 22px rgba(0, 242, 254, 0.45);
  color: #06080D;
}
.btn-danger {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.3);
  color: var(--accent-rose);
}
.btn-danger:hover {
  background: rgba(239, 68, 68, 0.22);
  border-color: var(--accent-rose);
}
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: var(--r-xs); }
.btn-icon { padding: 8px; border-radius: var(--r-sm); width: 34px; height: 34px; }
.btn svg { width: 15px; height: 15px; fill: currentColor; }

.input, .select, .textarea {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border-medium);
  border-radius: var(--r-sm);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
[data-theme="light"] .input, [data-theme="light"] .select, [data-theme="light"] .textarea {
  background: #FFFFFF;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
}

/* ─── BADGES ─────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2.5px 8.5px;
  border-radius: var(--r-full);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.badge-emerald { background: var(--accent-emerald-bg); color: var(--accent-emerald); border: 1px solid rgba(16,185,129,0.3); }
.badge-cyan { background: rgba(0, 242, 254, 0.12); color: var(--accent-cyan); border: 1px solid rgba(0, 242, 254, 0.3); }
.badge-amber { background: var(--accent-amber-bg); color: var(--accent-amber); border: 1px solid rgba(245,158,11,0.3); }
.badge-rose { background: var(--accent-rose-bg); color: var(--accent-rose); border: 1px solid rgba(239,68,68,0.3); }
.badge-purple { background: var(--accent-purple-bg); color: var(--accent-purple); border: 1px solid rgba(139,92,246,0.3); }
.badge-gray { background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* ─── KPI METRIC TILES ───────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.kpi-card {
  background: var(--bg-glass-card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-medium);
  box-shadow: var(--shadow-sm), var(--specular-border);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.kpi-header { display: flex; align-items: center; justify-content: space-between; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-icon-wrap {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  background: rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-cyan);
}
.kpi-icon-wrap svg { width: 16px; height: 16px; fill: currentColor; }
.kpi-value {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.kpi-footer {
  font-size: 11.5px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── BAN REDLINE GAUGE (DISTANCE TO 80 RPH) ─────────────────────────────── */
.redline-slot {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  margin-bottom: 8px;
}
.redline-slot:last-child { margin-bottom: 0; }
.redline-slot-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12.5px;
}
.redline-slot-name { font-weight: 600; color: var(--text-primary); }
.redline-slot-count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.redline-track {
  position: relative;
  height: 9px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: var(--r-full);
  overflow: visible;
}
.redline-fill {
  height: 100%;
  border-radius: var(--r-full);
  transition: width 0.4s ease;
}
.redline-fill.safe { background: linear-gradient(90deg, #10B981, #00F2FE); }
.redline-fill.warn { background: linear-gradient(90deg, #00F2FE, #F59E0B); }
.redline-fill.danger { background: linear-gradient(90deg, #F59E0B, #EF4444); }
.redline-marker {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2.5px;
  background: #EF4444;
  box-shadow: 0 0 8px #EF4444;
  border-radius: 1px;
  z-index: 2;
}
.redline-slot-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}

/* ─── TELEMETRY TABLES ───────────────────────────────────────────────────── */
.table-container { overflow-x: auto; width: 100%; }
.telemetry-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  text-align: left;
}
.telemetry-table th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-medium);
  white-space: nowrap;
}
.telemetry-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  white-space: nowrap;
}
.telemetry-table tr:hover td { background: var(--bg-surface-hover); }

/* ─── FORENSIC SLIDE-OUT DRAWER ──────────────────────────────────────────── */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.drawer-overlay.active { opacity: 1; pointer-events: auto; }
.forensic-drawer {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 540px;
  max-width: 90vw;
  background: var(--bg-surface-elevated);
  border-left: 1px solid var(--border-medium);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
}
.drawer-overlay.active .forensic-drawer { transform: translateX(0); }
.drawer-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-body {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ─── AI PLAYGROUND STUDIO ───────────────────────────────────────────────── */
.playground-studio {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 20px;
  min-height: 680px;
}
@media (max-width: 980px) { .playground-studio { grid-template-columns: 1fr; } }

.play-control-dock {
  background: var(--bg-glass-card);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-medium);
  border-radius: var(--r-md);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: var(--shadow-sm), var(--specular-border);
}

.play-chat-viewport {
  background: var(--bg-glass-card);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-medium);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm), var(--specular-border);
}
.play-messages-feed {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.play-msg {
  display: flex;
  gap: 12px;
  max-width: 90%;
}
.play-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.play-msg.assistant { align-self: flex-start; }
.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.msg-avatar.user-av { background: var(--grad-primary); color: #07090E; }
.msg-avatar.ai-av { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.4); }

.msg-bubble {
  padding: 13px 18px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  line-height: 1.6;
}
.play-msg.user .msg-bubble {
  background: var(--grad-primary);
  color: #07090E;
  font-weight: 500;
  border-bottom-right-radius: 4px;
}
.play-msg.assistant .msg-bubble {
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
  width: 100%;
}

.thought-drawer {
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.25);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 12px;
}
.thought-drawer summary {
  cursor: pointer;
  color: var(--accent-purple);
  font-weight: 600;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.thought-body {
  margin-top: 8px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: pre-wrap;
  max-height: 240px;
  overflow-y: auto;
  line-height: 1.5;
}

.typing-cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: var(--accent-cyan);
  vertical-align: middle;
  margin-left: 2px;
  animation: blinkCursor 0.8s infinite;
}
@keyframes blinkCursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.msg-telemetry-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
  font-size: 11px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.msg-telemetry-strip b { color: var(--text-primary); }

.play-input-tray {
  padding: 14px 20px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.play-attached-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.play-file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-medium);
  border-radius: var(--r-full);
  font-size: 11.5px;
}
.play-file-chip .remove { cursor: pointer; color: var(--accent-rose); font-weight: bold; }

/* ─── MODAL SYSTEM (APPLE GLASS) ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 20px;
  animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal {
  width: 100%;
  max-width: 520px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg), var(--shadow-glow), var(--specular-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: 90vh;
  animation: modalScaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal.wide { max-width: 720px; }
.modal.xwide { max-width: 860px; }
@keyframes modalScaleUp {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.modal-body {
  padding: 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.modal-foot {
  padding: 14px 22px;
  border-top: 1px solid var(--border-subtle);
  background: rgba(0,0,0,0.15);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.modal-field { display: flex; flex-direction: column; gap: 6px; }
.modal-field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.modal-field .hint { font-size: 11px; color: var(--text-muted); }
.modal-err {
  padding: 8px 12px;
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: var(--r-xs);
  color: var(--accent-rose);
  font-size: 12px;
}

/* ─── SEGMENTED CONTROLS ─────────────────────────────────────────────────── */
.segbar {
  display: inline-flex;
  padding: 3px;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  gap: 3px;
}
.segbar button {
  background: transparent;
  border: none;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: all 0.2s;
}
.segbar button.on, .segbar button.active {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

/* ─── CODE WRAPPERS ──────────────────────────────────────────────────────── */
.code-block-wrap {
  background: #040609;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin: 8px 0;
}
.code-block-head {
  padding: 6px 14px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: var(--text-muted);
}
.code-block-wrap pre {
  padding: 14px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.55;
  color: #D1D5DB;
}

/* ─── SETTINGS CONFIG FORM ───────────────────────────────────────────────── */
.cfg-group {
  margin-bottom: 24px;
}
.cfg-group h3 {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cfg-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.cfg-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cfg-item.wide { grid-column: 1 / -1; }
.cfg-item label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.cfg-item .rthint { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-top: 3px; }
.cfg-item.check {
  flex-direction: row;
  align-items: flex-start;
  gap: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--r-xs);
  border: 1px solid var(--border-subtle);
}
.cfg-item.check input[type="checkbox"] {
  width: 17px; height: 17px; margin-top: 2px; flex-shrink: 0;
}

/* ─── TOAST NOTIFICATIONS ────────────────────────────────────────────────── */
#toastContainer {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 3000;
  pointer-events: none;
}
.toast-msg {
  padding: 10px 16px;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-lg);
  font-size: 12.5px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  animation: toastSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ─── LOGIN VIEW ─────────────────────────────────────────────────────────── */
.login-backdrop {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #0F172A 0%, #06080D 80%);
  z-index: 2000;
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-xl);
  padding: 38px 32px;
  box-shadow: var(--shadow-lg), var(--shadow-glow), var(--specular-border);
  display: flex;
  flex-direction: column;
  gap: 22px;
  text-align: center;
}
.login-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 12px; }
.login-header p { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }

/* Grid Layouts */
.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .grid-2col { grid-template-columns: 1fr; } }
.grid-3col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

/* Topbar View Toggle in Fleet */
.fleet-view-toggle {
  display: inline-flex;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border-medium);
  border-radius: var(--r-sm);
  padding: 2px;
}
.fleet-view-toggle button {
  background: transparent;
  border: none;
  padding: 4px 10px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--r-xs);
  cursor: pointer;
}
.fleet-view-toggle button.active {
  background: var(--accent-cyan);
  color: #06080D;
}

const api = async (path, opts = {}) => {
  const token = storage.get('admin_token', '');
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
    ...(opts.headers || {})
  };
  const r = await fetch(path, {
    credentials: 'include',
    ...opts,
    headers
  });
  if (r.status === 401) {
    storage.remove('admin_token');
    renderLogin();
    throw new Error('unauthorized');
  }
  return r.json();
};

/* ─── FORMATTERS & UTILITIES ──────────────────────────────────────────────── */
const fmt = {
  ts: (sec) => sec ? new Date(sec * 1000).toLocaleString('zh-TW', { hour12: false }) : '—',
  since: (sec) => {
    if (!sec) return '—';
    const diff = Math.max(0, Math.floor(Date.now() / 1000 - sec));
    if (diff < 60) return '剛剛';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
    return Math.floor(diff / 86400) + ' 天前';
  },
  ms: (ms) => ms == null ? '—' : (ms < 1000 ? Math.round(ms) + 'ms' : (ms/1000).toFixed(2) + 's'),
  num: (n) => (n || 0).toLocaleString(),
  pct: (n) => (n * 100).toFixed(1) + '%',
  bytes: (bytes) => {
    if (bytes == null || bytes === 0) return '0 B';
    const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  },
  resetCountdown: (iso) => {
    if (!iso) return '—';
    try {
      const target = new Date(iso).getTime();
      const diffSec = Math.floor((target - Date.now()) / 1000);
      if (diffSec <= 0) return '重置中';
      const h = Math.floor(diffSec / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      return `${h}h ${m}m 後重置`;
    } catch (e) { return '—'; }
  }
};

function toast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const t = document.createElement('div');
  t.className = `toast-msg`;
  const icon = type === 'error' ? '❌' : (type === 'success' ? '✅' : 'ℹ️');
  t.innerHTML = `<span>${icon}</span> <span>${escapeHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    t.style.transition = 'all 0.25s ease';
    setTimeout(() => t.remove(), 250);
  }, 3500);
}

function escapeHtml(s) {
  if (typeof s !== 'string') return String(s || '');
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ─── MODAL CONTROLLER ───────────────────────────────────────────────────── */
function buildModal({ title, bodyHTML, submitText = '確定', cancelText = '取消', danger = false, wide = false, onReady, onSubmit }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="btn btn-sm btn-icon" data-act="cancel">✕</button>
        </div>
        <div class="modal-err" style="display:none;margin:14px 22px 0 22px;"></div>
        <div class="modal-body">${bodyHTML || ''}</div>
        <div class="modal-foot">
          <button class="btn" data-act="cancel">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escapeHtml(submitText)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    if (onReady) onReady(overlay);

    const finish = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler);
      resolve(val);
    };

    const showErr = (msg) => {
      const errBox = overlay.querySelector('.modal-err');
      if (errBox) {
        errBox.textContent = msg;
        errBox.style.display = msg ? 'block' : 'none';
      }
    };

    overlay.querySelectorAll('[data-act=cancel]').forEach(b => b.onclick = () => finish(null));
    overlay.querySelector('[data-act=ok]').onclick = async () => {
      const res = onSubmit ? await onSubmit(overlay) : true;
      if (res === false) return;
      if (res && typeof res === 'object' && res.error) {
        showErr(res.error);
        return;
      }
      finish(res === true ? true : res);
    };

    overlay.onclick = (e) => {
      if (e.target === overlay) finish(null);
    };

    const keyHandler = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && document.activeElement?.tagName !== 'TEXTAREA') {
        overlay.querySelector('[data-act=ok]')?.click();
      }
    };
    document.addEventListener('keydown', keyHandler);

    setTimeout(() => {
      const first = overlay.querySelector('input, textarea, select');
      if (first) first.focus();
    }, 50);
  });
}

  (s || '').split(';').forEach(p => {
    const t = p.trim();
    const i = t.indexOf('=');
    if (i > 0) out[t.slice(0, i)] = t.slice(i + 1);

/* ─── BAN REDLINE CONSTANTS ───────────────────────────────────────────────── */
const BAN_LINE = 80; // 實測單出口 80-180 次/小時進入 sorry/index，取保守下沿 80

function renderRedlineTrack(rph, limitRph) {
  const pct = Math.min((rph / BAN_LINE) * 100, 100);
  const limitPct = limitRph ? Math.min((limitRph / BAN_LINE) * 100, 100) : null;
  const fillCls = rph >= BAN_LINE ? 'danger' : (rph >= BAN_LINE * 0.75 ? 'warn' : 'safe');
  return `
    <div class="redline-track">
      <div class="redline-fill ${fillCls}" style="width: ${pct}%"></div>
      ${limitPct !== null ? `<div class="redline-marker" style="left: ${limitPct}%" title="本地 RPH 限流門檻: ${limitRph}"></div>` : ''}
    </div>
  `;
}

function getRedlineBadge(rph) {
  if (rph >= BAN_LINE) {
    return `<span class="badge badge-rose">已越過紅線 (${rph}/${BAN_LINE})</span>`;
  } else if (rph >= BAN_LINE * 0.75) {
    return `<span class="badge badge-amber">接近紅線 (剩餘 ${BAN_LINE - rph} 次)</span>`;
  } else if (rph > 0) {
    return `<span class="badge badge-emerald">安全距離 (剩餘 ${BAN_LINE - rph} 次)</span>`;
  }
  return `<span class="badge badge-cyan">本小時無請求</span>`;
}

let rtCfgCache = null, rtModels = [];

function renderSettingsFormHTML() {
  return RT_GROUPS.map(g => `
    <div class="cfg-group">
      <h3>${escapeHtml(g.title)}</h3>
      <div class="cfg-grid">
        ${g.fields.map(f => {
          const v = rtCfgCache[f.k];
          let input;
          if (f.type === 'bool') {
            input = `<input type="checkbox" id="rt_${f.k}" ${v ? 'checked' : ''}>`;
          } else if (f.type === 'select') {
            input = `<select class="select" id="rt_${f.k}">` + rtModels.map(m =>
              `<option value="${escapeHtml(m)}" ${m === v ? 'selected' : ''}>${escapeHtml(m)}</option>`
            ).join('') + '</select>';
          } else if (f.type === 'int') {
            input = `<input class="input" type="number" id="rt_${f.k}" value="${v != null ? v : ''}" min="${f.min || 0}" max="${f.max || 9999999}">`;
          } else {
            input = `<input class="input" type="text" id="rt_${f.k}" value="${escapeHtml(String(v ?? ''))}">`;
          }

          if (f.type === 'bool') {
            return `
              <div class="cfg-item check">
                ${input}
                <div>
                  <label for="rt_${f.k}" style="cursor:pointer">${f.label}</label>
                  ${f.hint ? `<div class="rthint">${escapeHtml(f.hint)}</div>` : ''}
                </div>
              </div>
            `;
          }
          return `
            <div class="cfg-item${f.wide ? ' wide' : ''}">
              <label for="rt_${f.k}">${f.label}</label>
              ${input}
              ${f.hint ? `<div class="rthint">${escapeHtml(f.hint)}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
}

async function saveSettings() {
  const msg = document.getElementById('rtCfgMsg');
  const body = { ...(rtCfgCache || {}) };

  for (const f of RT_GROUPS.flatMap(g => g.fields)) {
    const el = document.getElementById('rt_' + f.k);
    if (!el) continue;
    body[f.k] = f.type === 'bool' ? el.checked
      : f.type === 'int' ? parseInt(el.value, 10)
      : el.value.trim();
  }

  if (msg) { msg.textContent = '保存中…'; msg.style.color = 'var(--text-muted)'; }

  try {
    const res = await api('api/config', {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    if (res.ok || res.config) {
      rtCfgCache = res.config;
      if (msg) {
        msg.textContent = '✅ 設定已成功更新並持久化至 SQLite WAL！';
        msg.style.color = 'var(--accent-emerald)';
        setTimeout(() => { msg.textContent = ''; }, 3500);
      }
      toast('設定已成功生效！', 'success');
      loadGlobalTelemetry();
    } else {
      throw new Error(res.error || '保存失敗');
    }
  } catch (e) {
    if (msg) {
      msg.textContent = '❌ 保存失敗: ' + e.message;
      msg.style.color = 'var(--accent-rose)';
    }
    toast('設定儲存失敗: ' + e.message, 'error');
  }
}

    const series = tsData.series || [];
    const labels = series.map(b => {
      const d = new Date(b.bucket * 1000);
      return tsData.range === '30d'
        ? `${d.getMonth()+1}/${d.getDate()}`
        : `${String(d.getHours()).padStart(2,'0')}:00`;
    });
    const reqs = series.map(b => b.requests || 0);
    const p50 = series.map(b => Math.round(b.p50_ms || 0));
    const p95 = series.map(b => Math.round(b.p95_ms || 0));

    charts['traffic'] = new Chart(ctxTraffic, {
      type: 'line',
      data: {
        labels: labels.length ? labels : ['00:00','04:00','08:00','12:00','16:00','20:00','24:00'],
        datasets: [
          {
            label: '請求吞吐量 (Requests)',
            data: reqs.length ? reqs : [0, 0, 0, 0, 0, 0, 0],
            borderColor: '#00F2FE',
            backgroundColor: 'rgba(0, 242, 254, 0.12)',
            fill: true,
            tension: 0.35,
            yAxisID: 'y'
          },
          {
            label: '中位數延遲 P50 (ms)',
            data: p50.length ? p50 : [0, 0, 0, 0, 0, 0, 0],
            borderColor: '#8B5CF6',
            borderDash: [3, 3],
            backgroundColor: 'transparent',
            tension: 0.35,
            yAxisID: 'y1'
          },
          {
            label: '長尾延遲 P95 (ms)',
            data: p95.length ? p95 : [0, 0, 0, 0, 0, 0, 0],
            borderColor: '#F59E0B',
            borderDash: [5, 5],
            backgroundColor: 'transparent',
            tension: 0.35,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#9CA3AF', font: { family: 'inherit', size: 11.5 } } }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6B7280' } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6B7280' }, title: { display: true, text: '請求量', color: '#6B7280' } },
          y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#8B5CF6' }, title: { display: true, text: '延遲 (ms)', color: '#8B5CF6' } }
        }
      }
    });
  }
}

async function loadDashboardTimeseries(range) {
  const seg = document.getElementById('tsRangeSeg');
  if (seg) {
    seg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', b.textContent.toLowerCase() === range);
    });
  }
  try {
    const tsData = await api(`api/timeseries?range=${range}`);
    const stats = await api('api/stats?hours=24').catch(() => ({ by_model: [] }));
    if (charts['traffic']) {
      charts['traffic'].destroy();
      delete charts['traffic'];
    }
    renderDashboardCharts(tsData, stats.by_model || []);
    toast(`已更新 ${range.toUpperCase()} 時序波形`, 'info');
  } catch (e) {
    toast('載入時序失敗: ' + e.message, 'error');
  }
}

/* ─── REQUESTS TABLE & PAGINATION & CSV EXPORT ───────────────────────────── */
let reqPageOffset = 0;
let reqTotalCount = 0;
let currentReqsList = [];

async function loadReqsTable(offset = reqPageOffset) {
  const tbody = document.getElementById('reqsTableBody');
  if (!tbody) return;

  reqPageOffset = offset;
  const status = document.getElementById('reqStatusFilter')?.value || '';
  const limit = parseInt(document.getElementById('reqLimitFilter')?.value || '50', 10);
  const url = `api/requests?limit=${limit}&offset=${offset}${status ? '&status=' + status : ''}`;

  tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:36px;color:var(--text-muted)">正在檢索飛行日誌...</td></tr>`;

  try {
    const data = await api(url);
    currentReqsList = data.items || [];
    reqTotalCount = data.total || 0;
    renderReqsTableRows();
    renderReqsPagination(limit, offset, reqTotalCount);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--accent-rose)">載入失敗: ${escapeHtml(e.message)}</td></tr>`;
  }
}

let searchDebounceTimer = null;
function debounceLoadReqs() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderReqsTableRows, 200);
}

function renderReqsTableRows() {
  const tbody = document.getElementById('reqsTableBody');
  if (!tbody) return;

  const keyword = (document.getElementById('reqSearchInput')?.value || '').toLowerCase().trim();
  const filtered = currentReqsList.filter(r => {
    if (!keyword) return true;
    return (r.model || '').toLowerCase().includes(keyword) ||
           (r.account_label || '').toLowerCase().includes(keyword) ||
           (r.proxy_name || '').toLowerCase().includes(keyword) ||
           (r.error || '').toLowerCase().includes(keyword) ||
           String(r.id).includes(keyword);
  });

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:36px;color:var(--text-muted)">無匹配的請求記錄</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const isOK = r.status === 200;
    const latencyColor = r.total_ms < 3000 ? 'badge-emerald' : (r.total_ms < 8000 ? 'badge-cyan' : 'badge-purple');
    const isModelSame = r.upstream_model ? r.model.includes(r.upstream_model) || r.upstream_model.includes(r.model) : true;

    return `
      <tr>
        <td class="mono fw-bold">#${r.id}</td>
        <td class="secondary mono">${fmt.ts(r.ts)}</td>
        <td class="fw-bold highlight">${escapeHtml(r.model)}</td>
        <td>
          ${r.upstream_model ? `
            <span class="badge ${isModelSame ? 'badge-gray' : 'badge-amber'}" title="${isModelSame ? '模型一致' : '上游靜默降級'}">
              ${escapeHtml(r.upstream_model)}
            </span>
          ` : '<span class="secondary mono">—</span>'}
        </td>
        <td>
          <span class="badge ${r.account_id ? 'badge-purple' : 'badge-gray'}">
            ${escapeHtml(r.account_label || (r.account_id ? '#' + r.account_id : '匿名'))}
          </span>
        </td>
        <td class="secondary">${escapeHtml(r.proxy_name || '直連')}</td>
        <td>
          <span class="badge ${isOK ? 'badge-emerald' : 'badge-rose'}">
            ${r.status} ${isOK ? 'OK' : 'FAIL'}
          </span>
        </td>
        <td class="mono">${r.ttfb_ms ? r.ttfb_ms + 'ms' : '—'}</td>
        <td><span class="badge ${latencyColor}">${fmt.ms(r.total_ms)}</span></td>
        <td class="mono">${r.prompt_tokens || 0} / ${r.output_tokens || 0}</td>
        <td>
          <button class="btn btn-sm" onclick="openDrawer(${r.id})">鑑識</button>
        </td>
      </tr>
    `;
  }).join('');
}

function renderReqsPagination(limit, offset, total) {
  const pageInfo = document.getElementById('reqsPageInfo');
  const pageBtns = document.getElementById('reqsPageBtns');
  if (!pageInfo || !pageBtns) return;

  const curPage = Math.floor(offset / limit) + 1;
  const totalPages = Math.ceil(total / limit) || 1;
  pageInfo.innerHTML = `顯示第 <b>${offset + 1}</b> - <b>${Math.min(offset + limit, total)}</b> 筆 · 共 <b>${total}</b> 筆 (第 ${curPage} / ${totalPages} 頁)`;

  pageBtns.innerHTML = `
    <button class="btn btn-sm" ${offset === 0 ? 'disabled' : ''} onclick="loadReqsTable(${Math.max(0, offset - limit)})">上一頁</button>
    <button class="btn btn-sm" ${offset + limit >= total ? 'disabled' : ''} onclick="loadReqsTable(${offset + limit})">下一頁</button>
  `;
}

function exportRequestsCSV() {
  if (!currentReqsList || !currentReqsList.length) {
    toast('目前無日誌可導出', 'error');
    return;
  }

  const headers = ['ID', 'Timestamp', 'Date', 'Model', 'Upstream_Model', 'Account_ID', 'Account_Label', 'Proxy_ID', 'Proxy_Name', 'Status', 'Error', 'TTFB_ms', 'Total_ms', 'Prompt_Tokens', 'Output_Tokens', 'Stream'];
  const rows = currentReqsList.map(r => [
    r.id,
    r.ts,
    `"${fmt.ts(r.ts)}"`,
    `"${r.model || ''}"`,
    `"${r.upstream_model || ''}"`,
    r.account_id || 0,
    `"${(r.account_label || '').replace(/"/g, '""')}"`,
    r.proxy_id || 0,
    `"${(r.proxy_name || '').replace(/"/g, '""')}"`,
    r.status,
    `"${(r.error || '').replace(/"/g, '""')}"`,
    r.ttfb_ms || 0,
    r.total_ms || 0,
    r.prompt_tokens || 0,
    r.output_tokens || 0,
    r.stream ? 1 : 0
  ]);

  const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aether-requests-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已成功導出 CSV 日誌！', 'success');
}

      <div style="background:rgba(0,0,0,0.2);padding:12px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:8px">

            <div style="height:100%;background:#F59E0B;border-radius:3px;width:${Math.min(100, (Math.max(0, req.total_ms - (req.ttfb_ms || 0)) / (req.total_ms || 1)) * 100)}%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Error or Diagnostic -->
    ${req.error ? `
      <div>
        <h4 style="font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent-rose)">上游回傳異常診斷</h4>
        <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);padding:12px;border-radius:var(--r-sm);color:var(--accent-rose);font-family:var(--font-mono);font-size:12px">
          ${escapeHtml(req.error)}

    ` : ''}

    <!-- Token Scaling -->

      <h4 style="font-size:13px;font-weight:600;margin-bottom:6px">Token 統計規模</h4>
      <div class="kpi-grid" style="grid-template-columns:1fr 1fr;gap:10px">
        <div style="background:rgba(0,0,0,0.2);padding:10px;border-radius:var(--r-sm)">

function closeDrawer(e) {
  if (!e || e.target.id === 'drawerOverlay' || e.target.tagName === 'BUTTON') {
    document.getElementById('drawerOverlay')?.classList.remove('active');
  }
}

async function showAddCookieModal() {
  let extras = {};

  const result = await buildModal({
    title: '導入 Google 帳號憑證',
    wide: true,
    bodyHTML: `
      <div class="modal-field">
        <label>帳號識別標籤</label>
        <input class="input" id="cookieLabel" type="text" placeholder="例如: my-account@gmail.com" />

      </div>

      <div class="segbar" id="cookieSegBar" style="margin-top:10px">
        <button type="button" class="on" data-mode="raw">整串貼上 (推薦)</button>
        <button type="button" data-mode="fields">逐項填寫</button>
      </div>

      <div id="cookiePaneRaw" style="margin-top:10px">
        <div class="modal-field">
          <label>Cookie 整串字串 (含 SAPISID / 1PSID)</label>
          <textarea class="textarea" id="cookieRawText" rows="6" spellcheck="false"
            placeholder="SID=...; HSID=...; SSID=...; APISID=...; SAPISID=...; __Secure-1PSID=...; __Secure-1PSIDTS=..."></textarea>
          <div class="hint">F12 複製 gemini.google.com 的整段 Cookie 貼上。至少需包含 SAPISID。多餘項會一併保留以增強真實指紋。</div>
        </div>
      </div>

      <div id="cookiePaneFields" style="display:none;margin-top:10px">
        <div class="grid-2col">
          ${COOKIE_KEYS.map(c => `
            <div class="modal-field">
              <label>${escapeHtml(c.k)}${c.req ? ' <span style="color:var(--accent-rose)">*</span>' : ''}</label>
              <input class="input" data-ck="${escapeHtml(c.k)}" type="text" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(c.hint || '')}" />
            </div>
          `).join('')}
        </div>
        <div id="cookieExtrasNote" style="font-size:11.5px;color:var(--text-muted);margin-top:6px"></div>
      </div>

      <div class="modal-field" style="margin-top:12px">
        <label>備註資訊</label>
        <input class="input" id="cookieNote" type="text" placeholder="可留空" />
      </div>
    `,
    submitText: '確認導入',
    onReady: (overlay) => {
      const inputs = () => [...overlay.querySelectorAll('[data-ck]')];
      const ta = overlay.querySelector('#cookieRawText');
      const extrasNote = overlay.querySelector('#cookieExtrasNote');

      const fieldsToRaw = () => {
        const obj = {};
        inputs().forEach(el => { if (el.value.trim()) obj[el.dataset.ck] = el.value.trim(); });
        ta.value = joinCookieObj({ ...obj, ...extras });
      };

      const rawToFields = () => {
        const obj = parseCookieStr(ta.value);
        const known = new Set(COOKIE_KEYS.map(c => c.k));
        extras = {};
        Object.entries(obj).forEach(([k, v]) => { if (!known.has(k)) extras[k] = v; });
        inputs().forEach(el => { el.value = obj[el.dataset.ck] || ''; });
        const n = Object.keys(extras).length;
        if (extrasNote) {
          extrasNote.textContent = n ? `另有 ${n} 項未在上面列出的 Cookie，會自動一併保留。` : '';
        }
      };

      overlay.querySelectorAll('#cookieSegBar button').forEach(btn => {
        btn.onclick = () => {
          const mode = btn.dataset.mode;
          if (mode === 'raw') fieldsToRaw(); else rawToFields();
          overlay.querySelectorAll('#cookieSegBar button').forEach(b => b.classList.toggle('on', b === btn));
          overlay.querySelector('#cookiePaneFields').style.display = mode === 'fields' ? '' : 'none';
          overlay.querySelector('#cookiePaneRaw').style.display = mode === 'raw' ? '' : 'none';
        };
      });

      inputs().forEach(el => el.addEventListener('paste', (ev) => {
        const txt = (ev.clipboardData || window.clipboardData).getData('text') || '';
        if (txt.includes(';') && txt.includes('=')) {
          ev.preventDefault();
          ta.value = txt.trim();
          rawToFields();
        }
      }));
    },
    onSubmit: (overlay) => {
      const label = overlay.querySelector('#cookieLabel')?.value.trim() || '';
      const note = overlay.querySelector('#cookieNote')?.value.trim() || '';
      const isRaw = overlay.querySelector('#cookieSegBar button.on')?.dataset.mode === 'raw';
      let cookie = '';

      if (isRaw) {
        cookie = overlay.querySelector('#cookieRawText')?.value.trim() || '';
      } else {
        const obj = {};
        overlay.querySelectorAll('[data-ck]').forEach(el => {
          if (el.value.trim()) obj[el.dataset.ck] = el.value.trim();
        });
        cookie = joinCookieObj(obj);
      }

      if (!cookie) return { error: 'Cookie 不可為空' };
      if (!cookie.includes('SAPISID')) return { error: 'Cookie 遺失 SAPISID，無法計算安全授權頭！' };

      return { label, cookie, note };
    }
  });

  if (!result) return;
  try {
    const res = await api('api/cookies', { method: 'POST', body: JSON.stringify(result) });
    toast(`帳號憑證已成功導入 (#${res.id})！`, 'success');
    refreshCurrentPage();
  } catch (e) {
    toast('導入失敗: ' + e.message, 'error');
  }
}

/* ─── SSE STREAMING & MARKDOWN PLAYGROUND LOGIC ───────────────────────────── */
let playMessages = [];
let playAttachedFiles = [];
let playAbortCtrl = null;

function renderMarkdown(md) {
  if (!md) return '';
  let html = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Code blocks
  html = html.replace(/```([a-zA-Z0-9_\-\+]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    return `<div class="code-block-wrap"><div class="code-block-head"><span>${lang || 'code'}</span><button class="btn btn-sm" onclick="copyCodeBlock(this)">複製</button></div><pre><code class="lang-${lang}">${code}</code></pre></div>`;
  });

  // Inline elements
  html = html.replace(/`([^`]+)`/g, '<code class="mono" style="background:rgba(255,255,255,0.08);padding:1px 5px;border-radius:4px;color:var(--accent-cyan)">$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  html = html.replace(/^&gt;\s+(.*)$/gm, '<blockquote style="border-left:3px solid var(--accent-cyan);padding-left:10px;color:var(--text-secondary);margin:6px 0">$1</blockquote>');
  html = html.replace(/\n\n/g, '<p style="margin:8px 0"></p>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function initPlaygroundClipboard() {
  const textEl = document.getElementById('playInputText');
  if (!textEl) return;
  textEl.addEventListener('paste', (e) => {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (const item of items) {
      if (item.type.indexOf('image') === 0) {
        const file = item.getAsFile();
        playAttachedFiles.push({ name: `pasted_image_${Date.now()}.png`, size: file.size, file, type: 'image' });
        renderAttachedChips();
        toast('已自動附加剪貼簿截圖！', 'info');
      }
    }
  });
}

function handlePlayFileInput(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  for (const f of files) {
    playAttachedFiles.push({ name: f.name, size: f.size, file: f, type: f.type.includes('image') ? 'image' : 'file' });
  }
  renderAttachedChips();
  input.value = '';
}

function renderAttachedChips() {

async function sendPlayMessage() {
  const inputEl = document.getElementById('playInputText');
  const sendBtn = document.getElementById('playSendBtn');
  const stopBtn = document.getElementById('playStopBtn');
  const statusLbl = document.getElementById('playStreamingStatus');
  const feed = document.getElementById('playMsgFeed');
  if (!inputEl || !feed) return;

  const rawText = inputEl.value.trim();
  if (!rawText && !playAttachedFiles.length) return;

  const model = document.getElementById('playModelSel')?.value || 'gemini-3.8-flash';
  const sysPrompt = document.getElementById('playSystemPrompt')?.value || '';
  const temp = parseFloat(document.getElementById('playTempVal')?.textContent || '0.2');

  // Render User Message
  let userDisplay = escapeHtml(rawText);
  if (playAttachedFiles.length > 0) {
    userDisplay = `<div style="font-size:11.5px;color:var(--accent-cyan);margin-bottom:6px">📎 附加 ${playAttachedFiles.length} 個附件: ${playAttachedFiles.map(f => escapeHtml(f.name)).join(', ')}</div>` + userDisplay;
  }
  const userMsgNode = document.createElement('div');
  userMsgNode.className = 'play-msg user';
  userMsgNode.innerHTML = `
    <div class="msg-avatar user-av">我</div>
    <div class="msg-bubble">${userDisplay}</div>
  `;
  feed.appendChild(userMsgNode);

  inputEl.value = '';
  playAttachedFiles = [];
  renderAttachedChips();
  feed.scrollTop = feed.scrollHeight;

  // Placeholder for Assistant Message
  const msgId = 'aimsg_' + Date.now();
  const aiMsgNode = document.createElement('div');
  aiMsgNode.className = 'play-msg assistant';
  aiMsgNode.innerHTML = `
    <div class="msg-avatar ai-av">✦</div>
    <div class="msg-bubble" id="${msgId}">
      <span class="muted"><span class="pulse-orb" style="display:inline-block;margin-right:6px"></span> 正在與 Google 建立流式連線...</span>
    </div>
  `;
  feed.appendChild(aiMsgNode);
  feed.scrollTop = feed.scrollHeight;

  sendBtn.style.display = 'none';
  stopBtn.style.display = 'inline-flex';
  statusLbl.textContent = '流式生成中...';

  playAbortCtrl = new AbortController();
  const startTime = Date.now();
  let firstTokenTime = null;
  let responseText = '';
  let reasoningText = '';
  let totalChunks = 0;

  const bubbleEl = document.getElementById(msgId);

  // Build Payload
  const msgs = [];
  if (sysPrompt) msgs.push({ role: 'system', content: sysPrompt });
  msgs.push(...playMessages);
  msgs.push({ role: 'user', content: rawText });

  try {
    const res = await fetch('../v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${window._playApiKey || ''}`
      },
      body: JSON.stringify({
        model,
        messages: msgs,
        temperature: temp,
        stream: true
      }),
      signal: playAbortCtrl.signal
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      bubbleEl.innerHTML = `<span style="color:var(--accent-rose)"><b>請求失敗 (${res.status}):</b> ${escapeHtml(err.error?.message || err.error || res.statusText)}</span>`;
      statusLbl.textContent = '失敗';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;
        const dataStr = trimmed.slice(5).trim();
        if (dataStr === '[DONE]') break;

        try {
          const chunk = JSON.parse(dataStr);
          const delta = chunk.choices?.[0]?.delta || {};

          if (delta.reasoning_content) {
            if (!firstTokenTime) firstTokenTime = Date.now() - startTime;
            reasoningText += delta.reasoning_content;
          }
          if (delta.content) {
            if (!firstTokenTime) firstTokenTime = Date.now() - startTime;
            responseText += delta.content;
            totalChunks++;
          }

          const elapsedSec = (Date.now() - startTime) / 1000;
          const estTokens = Math.ceil(responseText.length / 2.5);
          const velocity = elapsedSec > 0 ? (estTokens / elapsedSec).toFixed(1) : '0';

          let liveHTML = '';
          if (reasoningText) {
            liveHTML += `
              <details class="thought-drawer" open>
                <summary><span>🧠 思考過程 (Thinking · ${reasoningText.length} 字)</span></summary>
                <div class="thought-body">${escapeHtml(reasoningText)}</div>
              </details>
            `;
          }
          liveHTML += renderMarkdown(responseText) + '<span class="typing-cursor"></span>';
          liveHTML += `
            <div class="msg-telemetry-strip">
              <span>⚡ 速率: <b class="highlight">${velocity} tok/s</b></span>
              <span>首字: <b>${firstTokenTime ? firstTokenTime + 'ms' : '—'}</b></span>
              <span>字數: <b>${responseText.length}</b></span>
            </div>
          `;
          bubbleEl.innerHTML = liveHTML;
          feed.scrollTop = feed.scrollHeight;
        } catch (e) {}
      }
    }

    // Finalize rendering
    const totalMs = Date.now() - startTime;
    const estTokens = Math.ceil(responseText.length / 2.5);
    const avgVelocity = totalMs > 0 ? (estTokens / (totalMs / 1000)).toFixed(1) : '0';

    let finalHTML = '';
    if (reasoningText) {
      finalHTML += `
        <details class="thought-drawer">
          <summary><span>🧠 思考過程 (${reasoningText.length} 字符 · 已收起)</span></summary>
          <div class="thought-body">${escapeHtml(reasoningText)}</div>
        </details>
      `;
    }
    finalHTML += renderMarkdown(responseText);
    finalHTML += `
      <div class="msg-telemetry-strip">
        <span>⏱️ 總用時: <b>${totalMs}ms</b></span>
        <span>⚡ 首字 (TTFB): <b>${firstTokenTime ? firstTokenTime + 'ms' : '—'}</b></span>
        <span>📊 輸出: <b>${responseText.length} 字 (~${estTokens} tok)</b></span>
        <span>🚀 均速: <b class="highlight">${avgVelocity} tok/s</b></span>
      </div>
    `;
    bubbleEl.innerHTML = finalHTML;

    playMessages.push({ role: 'user', content: rawText });
    playMessages.push({ role: 'assistant', content: responseText });
    statusLbl.textContent = '完成';

  } catch (err) {
    if (err.name === 'AbortError') {
      bubbleEl.innerHTML += `<div style="color:var(--accent-amber);font-size:12px;margin-top:8px">⚠️ 用戶已主動終止生成</div>`;
      statusLbl.textContent = '已中止';
    } else {
      bubbleEl.innerHTML = `<span style="color:var(--accent-rose)"><b>連線中斷:</b> ${escapeHtml(err.message)}</span>`;
      statusLbl.textContent = '異常';
    }
  } finally {
    sendBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    playAbortCtrl = null;
    feed.scrollTop = feed.scrollHeight;
  }
}

function stopPlayStream() {
  if (playAbortCtrl) {
    playAbortCtrl.abort();
    playAbortCtrl = null;
  }
}

async function pollFirefoxStatus() {
  const containerList = document.getElementById('ffWizardContainerList');
  const readyCountLbl = document.getElementById('ffWizardReadyCount');
  if (!containerList) {
    clearInterval(ffWizardPollTimer);
    return;
  }

  try {
    const data = await api('api/firefox/status');
    const list = data.containers || [];
    let readyCount = 0;

    if (!list.length) {
      containerList.innerHTML = `<div style="text-align:center;padding:18px;color:var(--text-muted);font-size:12px">
        尚未檢測到任何隔離容器。請先點擊上方第一步的「幫我自動建立容器」按鈕！
      </div>`;
      if (readyCountLbl) readyCountLbl.textContent = '已識別 0 個可用登入態';
      return;
    }

    containerList.innerHTML = list.map(c => {
      if (c.logged_in) readyCount++;
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);padding:8px 12px;border-radius:var(--r-sm)">

        <form onsubmit="doLogin(event)" style="display:flex;flex-direction:column;gap:14px">
          <input type="password" class="input" id="adminPwdInput" placeholder="請輸入管理員存取權杖 (ADMIN_TOKEN)" autofocus required style="text-align:center;padding:12px;font-size:14px">
          <button type="submit" class="btn btn-primary" style="padding:12px;font-size:14px">認證並進入系統</button>
        </form>
      </div>
    </div>
  `;
}

async function doLogin(e) {
  e.preventDefault();
  const pwd = document.getElementById('adminPwdInput')?.value?.trim() || '';
  try {
    const res = await fetch('api/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: pwd })
    });
    if (res.ok) {
      storage.set('admin_token', pwd);
      toast('認證成功，正在載入遙測中樞', 'success');
      renderShell();
    } else {
      toast('管理員 Token 錯誤，請確認密碼是否與啟動參數一致', 'error');
    }
  } catch (err) {
    toast('登入失敗: ' + err.message, 'error');
  }
}

async function doLogout() {
  if (!confirm('確定要安全登出嗎？')) return;
  try {
    await api('api/logout', { method: 'POST' });
  } catch (e) {}
  storage.remove('admin_token');
  renderLogin();
}

/* ─── INITIALIZATION BOOTSTRAP ────────────────────────────────────────────── */
(async () => {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const qToken = urlParams.get('token');
    if (qToken) {
      storage.set('admin_token', qToken);
    }
    const token = storage.get('admin_token', '');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3500);

    const r = await fetch('api/stats?hours=1', {
      credentials: 'include',
      headers,
      signal: controller.signal
    }).catch(() => null);
    clearTimeout(timeout);

    if (r && r.ok) {
      renderShell();
    } else {
      renderLogin();
    }
  } catch (e) {
    console.warn('Bootstrap auth check error:', e);
    renderLogin();
  }
})();
</script>
</body>
</html>
